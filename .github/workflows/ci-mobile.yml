name: 📱 CI — Mobile (Expo)

on:
  push:
    branches: [main, develop]
    paths:
      - 'comanda-plus/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'comanda-plus/mobile/**'
      - '.github/workflows/ci-mobile.yml'

defaults:
  run:
    working-directory: comanda-plus/mobile

jobs:
  ci-mobile:
    name: 📱 Verificação do Projeto Expo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: comanda-plus/mobile/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔍 Verificar App.js (sintaxe)
        run: node --check App.js

      - name: 🩺 Verificar saúde do projeto Expo
        run: npx expo-doctor
        continue-on-error: true
